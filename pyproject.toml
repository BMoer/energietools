[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "energietools"
version = "0.8.3"
description = "Austrian energy market calculations: electricity tariffs, grid fees per postcode, deterministic and with a full calculation path"
readme = "README.md"
authors = [{ name = "Benjamin Mörzinger", email = "b.moerzinger@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "energy", "electricity", "austria", "tariff-comparison", "grid-fees",
    "energy-community", "mcp", "open-data", "energiegemeinschaft", "netzentgelte",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Office/Business :: Financial",
    "Natural Language :: German",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "numpy>=1.24",
    "pandas>=2.0",
    "defusedxml>=0.7",
    "jsonschema>=4.0",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://www.gridbert.at"
Repository = "https://github.com/BMoer/energietools"
Issues = "https://github.com/BMoer/energietools/issues"
Methodology = "https://github.com/BMoer/energietools/blob/main/METHODIK.md"

[project.optional-dependencies]
# Kein LLM-Provider-Extra: energietools bündelt keinen LLM-Client. Fähigkeiten,
# die ein LLM brauchen (invoice_parser), bekommen einen Provider injiziert
# (Protokoll: energietools.tools.llm_protocol). Der konkrete Client lebt in der
# aufrufenden Anwendung (z.B. gridbert).
analysis = ["scikit-fda>=0.9", "matplotlib>=3.7", "entsoe-py>=0.6"]
pdf = ["pdfplumber>=0.11", "Pillow>=10.0", "fpdf2>=2.7"]
search = ["duckduckgo-search>=7.0"]
excel = ["openpyxl>=3.1"]
all = [
    "scikit-fda>=0.9",
    "matplotlib>=3.7",
    "entsoe-py>=0.6",
    "pdfplumber>=0.11",
    "Pillow>=10.0",
    "fpdf2>=2.7",
    "duckduckgo-search>=7.0",
    "openpyxl>=3.1",
]
dev = ["pytest>=8.0", "ruff>=0.6"]
xml = ["defusedxml>=0.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["energietools*"]

[tool.setuptools.package-data]
energietools = [
    "data/*.json", "data/tariffs/*.json", "data/netz/*.json", "data/providers/*.json", "data/spot/*.json",
    "data/foerderungen/*.json", "data/beratung/*.json", "data/energiegemeinschaften/*.json",
    "data/marktdaten/*.json",
    # WISSEN-Schicht (D7/Amendment 9): muss im Dist mitreisen, sonst shipped der
    # Gateway den wiki-Baum nicht und get_knowledge findet keine Seiten (WP-P 3).
    "wiki/*.md", "wiki/*.txt",
    "wiki/foerderung/*.md", "wiki/gas/*.md", "wiki/markt/*.md", "wiki/messung/*.md",
    "wiki/netz/*.md", "wiki/steuern/*.md", "wiki/tarife/*.md", "wiki/wirtschaftlichkeit/*.md",
    # PROZESSE-Schicht (D7): YAML-Quellen + MANIFEST + Beispiel-Dialoge müssen im
    # Dist mitreisen, sonst kann der Gateway sie nicht rendern (in-process, wie get_knowledge).
    "prozesse/*.yaml", "prozesse/*.json", "prozesse/beispiele/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Eingebundener Fremdcode wird nicht mitgelintet. Er stellte 28 der 148 Befunde
# vom 10.08. — allesamt Importsortierung und Modernisierungshinweise, die beim
# nächsten Upstream-Abgleich nur Konflikte erzeugen würden.
extend-exclude = ["apps/simba/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
